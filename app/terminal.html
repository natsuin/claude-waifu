<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src file:; style-src file: 'unsafe-inline'; img-src http://127.0.0.1:*">
<title>Tatami Room terminal</title>
<link rel="stylesheet" href="vendor/xterm.css">
<style>
/* The terminal panel beside the desk: Claude over its girl and its color, like a Claude Waifu window. */
:root {
  --plum: #1f1726;
  --tint: #2a2233;
  --text: #f5e6f0;
  --muted: #a898b4;
  --line: rgba(195, 166, 255, .14);
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; }
body {
  display: flex;
  flex-direction: column;
  background: var(--plum);
  color: var(--text);
  font: 14px/1.4 "Bahnschrift", "Segoe UI Variable Text", "Segoe UI", sans-serif;
  border-left: 1px solid var(--line);
}
header {
  flex: none;
  display: flex;
  align-items: center;
  gap: 10px;
  height: 46px;
  padding: 0 12px 0 16px;
  border-bottom: 1px solid var(--line);
}
#dot { width: 10px; height: 10px; border-radius: 3px; background: var(--hue, var(--muted)); }
#name { font: 600 1.05rem/1 "Yu Mincho", "YuMincho", Georgia, serif; }
#hide {
  margin-left: auto;
  padding: 6px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--text);
  box-shadow: inset 0 0 0 1px var(--line);
  font: inherit;
  font-size: .84rem;
  cursor: pointer;
}
#hide:hover, #end:hover { background: rgba(255, 255, 255, .06); }
#hide:focus-visible, #end:focus-visible { outline: 2px solid #ff85c0; outline-offset: 2px; }
#end {
  padding: 6px 14px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: var(--muted);
  font: inherit;
  font-size: .84rem;
  cursor: pointer;
}
#end:hover { color: #ff85c0; }
/* Drag the panel's left edge to make it wider or narrower. */
#grip { position: fixed; left: 0; top: 0; bottom: 0; width: 6px; cursor: ew-resize; z-index: 5; }
#grip:hover, #grip.held { background: rgba(195, 166, 255, .25); }
main { position: relative; flex: 1; min-height: 0; background: var(--tint); }
.girl { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: .22; pointer-events: none; }
.girl[hidden] { display: none; }
.term { position: absolute; inset: 10px 4px 6px 12px; }
.term[hidden] { display: none; }
.xterm .xterm-viewport { background-color: transparent !important; }
.xterm-viewport::-webkit-scrollbar { width: 10px; }
.xterm-viewport::-webkit-scrollbar-track { background: transparent; }
.xterm-viewport::-webkit-scrollbar-thumb { border: 2px solid transparent; border-radius: 8px; background: rgba(195, 166, 255, .28) padding-box; }
.xterm-viewport::-webkit-scrollbar-thumb:hover { background-color: rgba(195, 166, 255, .45); }
.xterm-viewport::-webkit-scrollbar-button { display: none; }
</style>
</head>
<body>
<header>
  <span id="dot"></span>
  <span id="name">Claude</span>
  <button id="hide" type="button" title="Claude keeps running; its mat on the desk brings it back">Hide</button>
  <button id="end" type="button" title="Stop Claude and close this terminal">End</button>
</header>
<div id="grip" title="Drag to resize"></div>
<main id="main"><img class="girl" id="girl" alt="" hidden></main>
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="terminal.js"></script>
</body>
</html>
